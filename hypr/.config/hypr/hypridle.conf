general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on && hyprctl keyword monitor "eDP-1, 2560x1600@165, auto, 1.6"
}

# 150s - keyboard backlight off.
# UNVERIFIED: the device name. Confirm with `brightnessctl -l` on the laptop
# and correct it here if asus::kbd_backlight is not what it reports.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -rd asus::kbd_backlight
}

# 330s (5m30s) - screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 360s (6m) - lock
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# 900s (15m) - suspend.
# Note: a plain suspend keeps the disk encryption key in RAM. It is not a
# defence against someone with physical access. See the hibernation section
# of the README if that matters to you.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
