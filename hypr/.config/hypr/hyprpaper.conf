# hyprpaper 0.8.4 syntax: `preload` no longer exists and `wallpaper` is a block,
# not a `monitor,path` one-liner. The image itself is gitignored - drop your own
# at this path. The tilde is expanded by hyprpaper itself.
wallpaper {
    monitor = eDP-1
    path = ~/Pictures/wallpapers/wallpaper.jpg
}

splash = false
