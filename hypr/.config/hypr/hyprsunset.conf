# Time-based colour temperature. identity = no shift at all during the day.
# UNVERIFIED: profile blocks need a reasonably recent hyprsunset. Check with
# `hyprctl hyprsunset temperature` after the first login.
max-gamma = 100

profile {
    time = 7:00
    identity = true
}

profile {
    time = 20:00
    temperature = 4500
}

profile {
    time = 22:30
    temperature = 3500
}
