# Time-based colour temperature. identity = no shift at all during the day.
# Keys checked against hyprsunset's ConfigManager.cpp (0.4.0 is what Arch ships).
max-gamma = 100

profile {
    time = 7:00
    identity = true
}

profile {
    time = 20:00
    temperature = 4500
}

profile {
    time = 22:30
    temperature = 3500
}
