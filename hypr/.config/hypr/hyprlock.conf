# hyprlock 0.9.6: no_fade_in, grace and disable_loading_bar no longer exist.
# Fading is controlled by the animations block instead.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

# Flat colour rather than a blurred screenshot - the rest of the setup has no
# blur either, and it does not leak what was on screen.
background {
    monitor =
    color = rgba(0f0f0fff)
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(2a2a2aff)
    inner_color = rgba(1a1a1aff)
    font_color = rgba(e6e6e6ff)
    check_color = rgba(c678ddff)
    fail_color = rgba(ff6b6bff)
    fail_text = <i>wrong</i>
    fade_on_empty = false
    placeholder_text = <i>password</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(e6e6e6ff)
    font_size = 100
    font_family = JetBrainsMono Nerd Font Mono Bold
    position = 0, -300
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%Y-%m-%d")"
    color = rgba(6e6e6eff)
    font_size = 25
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -480
    halign = center
    valign = top
}
