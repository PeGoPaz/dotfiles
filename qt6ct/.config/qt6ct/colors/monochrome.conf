[ColorScheme]
; Monochrome: bg #0f0f0f, surface #1a1a1a, border #2a2a2a, muted #6e6e6e,
; text #e6e6e6. Accent #c678dd marks focus and selection only.
;
; One entry per QPalette role, in this order:
; windowText, button, light, midlight, dark, mid, text, brightText, buttonText,
; base, window, shadow, highlight, highlightedText, link, linkVisited,
; alternateBase, noRole, toolTipBase, toolTipText, placeholderText, accent
;
; No Qt style draws with the accent role; KDE's icon loader tints breeze
; folders with it. It is grey so folders do not look selected.
active_colors=#e6e6e6, #1a1a1a, #2a2a2a, #2a2a2a, #0f0f0f, #2a2a2a, #e6e6e6, #e6e6e6, #e6e6e6, #0f0f0f, #0f0f0f, #0f0f0f, #c678dd, #0f0f0f, #e6e6e6, #6e6e6e, #1a1a1a, #0f0f0f, #1a1a1a, #e6e6e6, #6e6e6e, #6e6e6e
inactive_colors=#e6e6e6, #1a1a1a, #2a2a2a, #2a2a2a, #0f0f0f, #2a2a2a, #e6e6e6, #e6e6e6, #e6e6e6, #0f0f0f, #0f0f0f, #0f0f0f, #c678dd, #0f0f0f, #e6e6e6, #6e6e6e, #1a1a1a, #0f0f0f, #1a1a1a, #e6e6e6, #6e6e6e, #6e6e6e
disabled_colors=#6e6e6e, #1a1a1a, #2a2a2a, #2a2a2a, #0f0f0f, #2a2a2a, #6e6e6e, #6e6e6e, #6e6e6e, #0f0f0f, #0f0f0f, #0f0f0f, #2a2a2a, #6e6e6e, #6e6e6e, #6e6e6e, #1a1a1a, #0f0f0f, #1a1a1a, #6e6e6e, #6e6e6e, #6e6e6e
