# Monochrome launcher. The accent marks the matched substring and nothing else.
[main]
font=JetBrainsMono Nerd Font Mono:size=12
terminal=ghostty -e
layer=overlay
lines=10
width=40
horizontal-pad=16
vertical-pad=12
inner-pad=6

[colors]
background=0f0f0fff
text=e6e6e6ff
match=c678ddff
selection=1a1a1aff
selection-text=e6e6e6ff
selection-match=c678ddff
border=2a2a2aff

[border]
width=1
radius=0
